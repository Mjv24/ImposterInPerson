<!DOCTYPE html>

<style>
:root{--ink:#1d1340;--mut:#6b5f8f;--pink:#ff3d8b;--yellow:#ffd23f;--cyan:#21d4fd;--lime:#7ae582;--orange:#ff8c42;--purple:#8b5cf6;--paper:#fff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

 background:radial-gradient(circle at 10% 15%,#ffc2dd 0 120px,transparent 121px),radial-gradient(circle at 92% 8%,#b8f2ff 0 150px,transparent 151px),radial-gradient(circle at 88% 85%,#fff08a 0 140px,transparent 141px),radial-gradient(circle at 5% 90%,#c9f7cf 0 110px,transparent 111px),radial-gradient(#ffd9a8 1.5px,transparent 1.5px) 0 0/22px 22px,#fff4d6;background-attachment:fixed}
#app{max-width:560px;margin:0 auto;padding:22px 16px 110px;position:relative}
.dot{font-family:'Fredoka',sans-serif;font-weight:700;color:var(--ink);letter-spacing:.01em}

.logo{font-size:clamp(54px,16vw,84px);line-height:1;text-align:center;margin:6px 0 10px}
.logo span{display:inline-block;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:4px 4px 0 var(--ink);animation:hop 1.8s ease-in-out infinite}
.logo span:nth-child(8n+1){color:var(--pink)}.logo span:nth-child(8n+2){color:var(--yellow)}.logo span:nth-child(8n+3){color:var(--cyan)}.logo span:nth-child(8n+4){color:var(--lime)}.logo span:nth-child(8n+5){color:var(--orange)}.logo span:nth-child(8n+6){color:var(--purple)}.logo span:nth-child(8n+7){color:var(--pink)}.logo span:nth-child(8n+8){color:var(--yellow)}
.logo span:nth-child(2){animation-delay:.1s}.logo span:nth-child(3){animation-delay:.2s}.logo span:nth-child(4){animation-delay:.3s}.logo span:nth-child(5){animation-delay:.4s}.logo span:nth-child(6){animation-delay:.5s}.logo span:nth-child(7){animation-delay:.6s}.logo span:nth-child(8){animation-delay:.7s}
@keyframes hop{0%,60%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-10px) rotate(-6deg)}}
.castle{text-align:center;font-size:58px;margin-top:22px}
.r{color:var(--pink)}
.sub{color:var(--ink);text-align:center;font-size:13px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;margin:0 auto 26px;background:var(--yellow);border:2.5px solid var(--ink);border-radius:999px;padding:6px 16px;width:max-content;max-width:100%;transform:rotate(-2deg);box-shadow:3px 3px 0 var(--ink)}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:24px;padding:18px;margin-bottom:16px;box-shadow:6px 6px 0 var(--ink)}

.card:nth-of-type(3n+2){box-shadow:6px 6px 0 var(--cyan),6px 6px 0 3px var(--ink)}

.label{font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
input,select{width:100%;background:#fffaf0;border:3px solid var(--ink);color:var(--ink);border-radius:16px;padding:14px;font:inherit;font-size:16px;font-weight:700;outline:none;appearance:none}
input::placeholder{color:#b3a9cc}
input:focus,select:focus{background:#fff;box-shadow:4px 4px 0 var(--cyan)}
select{background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat}

.btn{display:block;width:100%;padding:16px;border-radius:18px;border:3px solid var(--ink);background:var(--yellow);color:var(--ink);font-family:'Fredoka',sans-serif;font-weight:700;font-size:18px;letter-spacing:.04em;cursor:pointer;box-shadow:5px 5px 0 var(--ink);transition:transform .12s cubic-bezier(.34,1.56,.64,1),box-shadow .12s}
.btn:not(:disabled):hover{transform:translate(-2px,-2px) rotate(-1deg);box-shadow:7px 7px 0 var(--ink)}
.btn:not(:disabled):active{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--ink)}
.btn.ghost{background:#fff}
.btn.red{background:var(--pink);color:#fff;text-shadow:2px 2px 0 var(--ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{display:inline-block;width:auto;padding:7px 12px;font-size:13px;border-width:2.5px;box-shadow:3px 3px 0 var(--ink);border-radius:12px}
.top .btn.sm:first-child{background:var(--cyan)}
.row{display:flex;gap:10px}.row>*{flex:1}
.mt{margin-top:12px}.mt2{margin-top:18px}
.or{text-align:center;color:var(--mut);font-size:12px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;margin:22px 0 12px}
.err{color:#fff;background:var(--pink);border:3px solid var(--ink);border-radius:16px;padding:10px;text-align:center;margin-top:16px;font-weight:800}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:10px}
.top .code{font-size:30px;line-height:1;background:var(--lime);border:3px solid var(--ink);border-radius:14px;padding:4px 12px;box-shadow:3px 3px 0 var(--ink);display:inline-block;margin-top:4px;letter-spacing:.12em}
.meta{font-size:11px;color:var(--mut);letter-spacing:.16em;text-transform:uppercase;font-weight:900}
.linkbox{font-size:13px;font-weight:700;word-break:break-all;color:var(--purple);border:3px dashed var(--purple);background:#f3edff;border-radius:14px;padding:12px}
.players{list-style:none}
.players li{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:2px dashed #e6defa;font-weight:800}
.players li:last-child{border:none}
.av{width:38px;height:38px;flex:none;border-radius:50%;border:3px solid var(--ink);background:var(--yellow);color:var(--ink);display:grid;place-items:center;font-family:'Fredoka',sans-serif;font-size:17px;font-weight:700;text-transform:uppercase;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.players li:nth-child(6n+2) .av{background:var(--pink);color:#fff}.players li:nth-child(6n+3) .av{background:var(--cyan)}.players li:nth-child(6n+4) .av{background:var(--lime)}.players li:nth-child(6n+5) .av{background:var(--orange)}.players li:nth-child(6n) .av{background:var(--purple);color:#fff}

.players .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:10px;color:var(--ink);background:#ffe9a8;border-radius:999px;padding:2px 8px;letter-spacing:.08em;text-transform:uppercase;margin-left:6px;font-weight:900}
.tag.red{background:var(--pink);color:#fff}
.score{font-family:'Fredoka',sans-serif;font-weight:700;font-size:18px;background:var(--ink);color:var(--yellow);border-radius:10px;padding:2px 10px;min-width:38px;text-align:center}
.off{opacity:.4}
.x{background:#fff;border:2.5px solid var(--ink);border-radius:50%;width:30px;height:30px;color:var(--ink);font-size:16px;font-weight:900;cursor:pointer;line-height:1}
.stage{perspective:1000px}
.reveal{position:relative;overflow:hidden;min-height:310px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;user-select:none;border-radius:30px;border:3px solid var(--ink);background:linear-gradient(135deg,#21d4fd 0%,#7ae582 50%,#ffd23f 100%);box-shadow:8px 8px 0 var(--ink);margin-bottom:16px;padding:24px;transition:transform .2s}
.reveal:hover{transform:rotate(-1deg) scale(1.01)}
.reveal:after{content:"";position:absolute;inset:0;background:radial-gradient(rgba(255,255,255,.45) 2px,transparent 2.5px) 0 0/18px 18px;pointer-events:none}
.reveal:before{content:"";position:absolute;inset:-50%;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.55) 50%,transparent 60%);animation:shine 3s ease-in-out infinite;pointer-events:none;z-index:1}
@keyframes shine{from{transform:translateX(-60%)}to{transform:translateX(60%)}}
.reveal>*{position:relative;z-index:2}
.reveal.flipin{animation:flip .6s cubic-bezier(.34,1.56,.64,1)}
@keyframes flip{from{transform:rotateY(-90deg) scale(.9)}to{transform:rotateY(0) scale(1)}}
.reveal .big{font-size:clamp(36px,11vw,58px);line-height:1.05;word-break:break-word;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:4px 4px 0 var(--ink)}
.reveal .hint{color:var(--ink);background:rgba(255,255,255,.75);border-radius:999px;padding:4px 12px}
.reveal.imp{background:linear-gradient(135deg,#ff3d8b 0%,#8b5cf6 55%,#ff8c42 100%)}
.reveal.imp .big{color:var(--yellow)}
.emoji{font-size:64px;margin-bottom:8px;display:inline-block}
.reveal .emoji{animation:fl 2.2s ease-in-out infinite}
.reveal.imp .emoji{animation:wob 1.1s ease-in-out infinite}
@keyframes wob{25%{transform:rotate(-14deg) scale(1.15)}75%{transform:rotate(14deg) scale(1.15)}}
.hint{color:var(--mut);font-size:12px;margin-top:14px;letter-spacing:.1em;text-transform:uppercase;font-weight:800}
.mini{display:flex;justify-content:space-between;align-items:center;cursor:pointer;background:linear-gradient(90deg,#fff 0%,#fff6c9 100%)}
.mini b{font-family:'Fredoka',sans-serif;font-size:19px;color:var(--purple)}
.turn{text-align:center;padding:22px 12px;background:linear-gradient(180deg,#fff 0%,#ffeef6 100%)}
.turn .big{font-size:clamp(32px,9vw,46px);line-height:1.1}
.clues{list-style:none}
.clues li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:2px dashed #e6defa;font-size:15px;font-weight:700}
.clues li:last-child{border:none}
.clues .c{font-weight:900;text-align:right;color:#fff;background:var(--purple);border-radius:10px;padding:1px 10px}
.clues .c .muted,.clues .c:has(.muted){background:none}
.muted{color:var(--mut)!important;font-style:italic;font-weight:600}
.order{display:flex;flex-wrap:wrap;gap:6px}
.order span{font-size:12px;font-weight:800;border:2.5px solid var(--ink);border-radius:999px;padding:4px 11px;background:#fff}
.order span.now{background:var(--pink);color:#fff;animation:ring 1.2s infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(255,61,139,.7)}100%{box-shadow:0 0 0 12px rgba(255,61,139,0)}}
.order span.done{background:#e8f9ea;opacity:.7}
.vote{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vote button{padding:18px 10px;border-radius:18px;border:3px solid var(--ink);background:#fff;color:var(--ink);font-family:'Fredoka',sans-serif;font-size:18px;font-weight:600;cursor:pointer;word-break:break-word;box-shadow:4px 4px 0 var(--ink);transition:transform .15s cubic-bezier(.34,1.56,.64,1),background .2s}
.vote button:nth-child(4n+1){background:#e3f9ff}.vote button:nth-child(4n+2){background:#fff3c4}.vote button:nth-child(4n+3){background:#e5fbe7}.vote button:nth-child(4n){background:#ffe3ef}
.vote button:not(:disabled):hover{transform:translate(-2px,-3px) rotate(-1.5deg)}
.vote button.sel{background:var(--pink)!important;color:#fff;transform:scale(1.05) rotate(-2deg)}
.vote button:disabled{opacity:.6;cursor:default}
.banner{text-align:center;padding:26px 10px;background:linear-gradient(135deg,#fff6c9,#e3f9ff)}
.banner .big{font-size:clamp(36px,10vw,54px);line-height:1.05}
.banner .emoji{animation:bounce .8s cubic-bezier(.34,1.56,.64,1) infinite alternate}
@keyframes bounce{from{transform:translateY(0) scale(1)}to{transform:translateY(-14px) scale(1.15) rotate(8deg)}}
.wait{color:var(--ink);text-align:center;font-size:13px;letter-spacing:.1em;text-transform:uppercase;padding:14px;font-weight:900}
.how{color:var(--ink);font-size:14px;line-height:1.75;background:#f3edff}
.how b{color:var(--purple)}
.how ol{padding-left:20px}
.pulse{animation:p 1.2s infinite}@keyframes p{50%{opacity:.4}}
.float{animation:fl 2.6s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-10px) rotate(8deg)}}
.enter .card,.enter .reveal,.enter .banner{animation:popin .55s cubic-bezier(.34,1.56,.64,1) both}
.enter .card:nth-of-type(2){animation-delay:.06s}.enter .card:nth-of-type(3){animation-delay:.12s}.enter .card:nth-of-type(4){animation-delay:.18s}
@keyframes popin{from{opacity:0;transform:translateY(30px) scale(.85) rotate(-3deg)}to{opacity:1;transform:none}}
.spark{position:fixed;top:-30px;pointer-events:none;z-index:60;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.mote{position:fixed;bottom:-30px;pointer-events:none;z-index:-1;border-radius:50%;border:2px solid var(--ink);animation:rise linear infinite;opacity:.85}
.mote:nth-child(5n){background:var(--pink)}.mote:nth-child(5n+1){background:var(--yellow)}.mote:nth-child(5n+2){background:var(--cyan)}.mote:nth-child(5n+3){background:var(--lime)}.mote:nth-child(5n+4){background:var(--orange)}
@keyframes rise{to{transform:translateY(-115vh) translateX(50px) rotate(360deg)}}
#toast{position:fixed;left:50%;top:18px;transform:translateX(-50%) translateY(-130px);background:var(--lime);color:var(--ink);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:10px 18px;border-radius:16px;font-size:14px;font-weight:900;transition:transform .35s cubic-bezier(.34,1.56,.64,1);z-index:70;max-width:90vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0) rotate(-1deg)}
.chatbtn{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:20;background:var(--cyan);color:var(--ink);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);border-radius:18px;padding:12px 18px;font-family:'Fredoka',sans-serif;font-size:16px;font-weight:700;cursor:pointer}
.chatbtn .u{display:inline-block;background:var(--pink);color:#fff;border-radius:999px;padding:0 8px;margin-left:6px;border:2px solid var(--ink)}
.chat{position:fixed;left:0;right:0;bottom:0;z-index:30;max-width:560px;margin:0 auto;background:#fff;border:3px solid var(--ink);border-bottom:none;border-radius:24px 24px 0 0;display:flex;flex-direction:column;height:min(60vh,460px);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -6px 0 var(--cyan);animation:up .35s cubic-bezier(.34,1.56,.64,1)}
@keyframes up{from{transform:translateY(100%)}}
.chat.hidden,.chatbtn.hidden{display:none}
.chathead{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:3px solid var(--ink);font-family:'Fredoka',sans-serif;font-size:16px;font-weight:700;background:var(--yellow);border-radius:21px 21px 0 0}
#chatLog{flex:1;overflow-y:auto;padding:12px 18px;font-size:15px;line-height:1.5}
#chatLog .m{margin-bottom:8px;word-break:break-word}
#chatLog .m b{margin-right:6px;color:var(--purple)}
#chatLog .m b.r{color:var(--pink)}
#chatLog .sys{color:var(--mut);font-style:italic;font-size:12px;font-weight:700}
#chatForm{display:flex;gap:8px;padding:12px}
#chatForm button{background:var(--pink);color:#fff;border:3px solid var(--ink);border-radius:14px;padding:0 16px;font-family:'Fredoka',sans-serif;font-weight:700;font-size:15px;cursor:pointer}
#voiceBar{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:20;display:flex;gap:8px}
#voiceBar.hidden{display:none}
#voiceBar button{background:var(--lime);color:var(--ink);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);border-radius:18px;padding:12px 14px;font-family:'Fredoka',sans-serif;font-size:15px;font-weight:700;cursor:pointer}
#voiceBar button.mut{background:var(--pink);color:#fff}
#voiceBar button.lv{background:#fff}
#voiceBar button.talk{box-shadow:0 0 0 5px var(--lime),4px 4px 0 var(--ink)}
.av.talk{box-shadow:0 0 0 4px var(--lime),0 0 14px 4px var(--lime);transform:scale(1.08)}
.vic{font-size:14px;margin-left:6px}
.dz{background:#fff;border:2.5px solid var(--ink);border-radius:10px;padding:2px 6px;font-size:14px;cursor:pointer;margin-left:4px}
.dz.on{background:var(--pink)}
@media (prefers-reduced-motion:reduce){*,*:before{animation:none!important;transition:none!important}}
.starter{display:inline-block;background:var(--yellow);border:3px solid var(--ink);border-radius:14px;padding:4px 14px;box-shadow:3px 3px 0 var(--ink);font-family:'Fredoka',sans-serif;font-size:22px;font-weight:700;margin-top:6px}
.chk{font-size:16px;margin-left:6px}
</style>
</head>

<script>

const CATS = Object.keys(WORDS);
/* =========================================================
   IMPOSTER (in person) — NO CONNECTION BETWEEN PHONES
   Every phone computes the same deal from a shared game code
   + round number. Nothing is sent over the network, so it
   can't fail to connect (works even offline once loaded).
   ========================================================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const B32 = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // 32 symbols (no I,O,0,1)
const B32R = B32;
const MIN_P = 3, MAX_P = 16;

/* ---------- seeded random (same on every phone) ---------- */
function hash(str) { let h = 2166136261 >>> 0; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return h; }
function rng(seedStr) { let a = hash(seedStr); return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function sshuffle(arr, r) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ---------- game code: seed(16) | players-3(4) | imp-1(2) | hint(1) | cat(5) = 28 bits → 6 chars ---------- */
function encode(cfg) {
  let n = cfg.seed & 0xFFFF;
  n = n * 16 + (cfg.players - 3);
  n = n * 4 + (cfg.imposters - 1);
  n = n * 2 + (cfg.hint ? 1 : 0);
  n = n * 32 + cfg.cat;
  let s = ''; for (let i = 0; i < 6; i++) { s = B32[n % 32] + s; n = Math.floor(n / 32); }
  return s;
}
function decode(code) {
  code = String(code || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (code.length !== 6) return null;
  let n = 0;
  for (const ch of code) { const v = B32R.indexOf(ch); if (v < 0) return null; n = n * 32 + v; }
  const cat = n % 32; n = Math.floor(n / 32);
  const hint = n % 2 === 1; n = Math.floor(n / 2);
  const imposters = n % 4 + 1; n = Math.floor(n / 4);
  const players = n % 16 + 3; n = Math.floor(n / 16);
  const seed = n;
  if (players > MAX_P || imposters > 3 || cat > CATS.length || seed > 0xFFFF) return null;
  return { code, seed, players, imposters, hint, cat };
}
const catName = c => c === 0 ? 'All categories' : CATS[c - 1];

/* ---------- deal for a round (deterministic) ---------- */
function deal(cfg, round) {
  // word list: seeded shuffle, one new word per round, no repeats until list runs out
  const pairs = cfg.cat === 0 ? CATS.flatMap(c => WORDS[c].map(w => [c, w])) : WORDS[CATS[cfg.cat - 1]].map(w => [CATS[cfg.cat - 1], w]);
  const deck = sshuffle(pairs, rng(cfg.code + '|words'));
  const [category, word] = deck[(round - 1) % deck.length];
  const nImp = Math.min(cfg.imposters, Math.max(1, Math.floor((cfg.players - 1) / 2)));
  // fair rotation, replayed from round 1 so every phone agrees:
  // never repeat last round's imposter(s), prefer fewest-times-imposter, random among ties
  const cnt = Array(cfg.players + 1).fill(0); let last = []; let imps = [];
  const seats = Array.from({ length: cfg.players }, (_, i) => i + 1);
  for (let r = 1; r <= round; r++) {
    const R = rng(cfg.code + '|imp|' + r);
    let pool = seats.filter(s => !last.includes(s)); if (pool.length < nImp) pool = seats.slice();
    imps = [];
    while (imps.length < nImp) {
      const left = pool.filter(s => !imps.includes(s));
      const min = Math.min(...left.map(s => cnt[s]));
      const best = left.filter(s => cnt[s] === min);
      imps.push(best[Math.floor(R() * best.length)]);
    }
    imps.forEach(s => cnt[s]++); last = imps.slice();
  }
  const starter = 1 + Math.floor(rng(cfg.code + '|start|' + round)() * cfg.players);
  return { word, category, imps: imps.sort((a, b) => a - b), starter, nImp };
}

/* ---------- state ---------- */
const saved = JSON.parse(localStorage.getItem('imp_irl') || 'null');
const App = {
  screen: 'home', cfg: null, seat: 0, round: 1, revealed: false, flipAnim: false, answer: false, status: '',
  setup: { players: 5, imposters: 1, hint: true, cat: 0 }, viewKey: ''
};
function save() { localStorage.setItem('imp_irl', JSON.stringify({ code: App.cfg && App.cfg.code, seat: App.seat, round: App.round })); }
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2400); }
const gameLink = code => `${location.origin}${location.pathname}?g=${code}`;

/* ---------- views ---------- */
const vHow = () => `<div class="card how"><div class="label">How to play (in person)</div><ol>
<li>One person taps <b>New game</b> and reads out the 6-letter code.</li>
<li>Everyone enters the code and picks a <b>different player number</b> (e.g. go around the circle: 1, 2, 3…).</li>
<li>Tap your card — everyone sees the <b>same word</b>, except the <b class="r">imposter</b> 😈.</li>
<li>Play out loud. Then tap <b>Reveal answer</b>, and everyone taps <b>Next round</b> together.</li></ol>
<p class="hint" style="margin-top:8px">No connection between phones needed — works on any Wi-Fi, mobile data or even offline.</p></div>`;

function vHome() {
  const urlCode = new URLSearchParams(location.search).get('g') || '';
  return `<div class="castle float">🕵️</div><h1 class="logo dot">${[...'IMPOSTER'].map(c => `<span>${c}</span>`).join('')}</h1>
  <p class="sub">one of you is lying</p>
  <button class="btn" data-a="newgame">✨ New game</button>
  <div class="or">or join with a code</div>
  <div class="row"><input id="code" maxlength="6" placeholder="CODE" value="${esc(urlCode || '')}" style="text-transform:uppercase;letter-spacing:.25em;text-align:center" autocomplete="off"><button class="btn ghost" data-a="join" style="flex:.55">Join</button></div>
  ${saved && saved.code && decode(saved.code) ? `<button class="btn ghost mt" data-a="resume">↩ Resume ${esc(saved.code)} · Player ${saved.seat} · Round ${saved.round}</button>` : ''}
  ${App.status ? `<p class="err">${esc(App.status)}</p>` : ''}
  <div class="mt2">${vHow()}</div>`;
}
function vSetup() {
  const s = App.setup;
  const opt = (v, cur, label) => `<option value="${v}" ${String(v) === String(cur) ? 'selected' : ''}>${esc(label ?? v)}</option>`;
  const maxImp = Math.max(1, Math.floor((s.players - 1) / 2));
  return `<div class="top"><div><div class="meta">✨ New game</div></div><button class="btn sm ghost" data-a="home">Back</button></div>
  <div class="card"><div class="label">Number of players</div>
    <select id="set-players">${Array.from({ length: MAX_P - MIN_P + 1 }, (_, i) => opt(i + MIN_P, s.players)).join('')}</select>
    <div class="row mt">
      <div><div class="label" style="margin-bottom:6px">Imposters</div><select id="set-imposters">${[1, 2, 3].map(n => opt(n, Math.min(s.imposters, maxImp), n > maxImp ? n + ' (need more players)' : n)).join('')}</select></div>
      <div><div class="label" style="margin-bottom:6px">Imposter sees category</div><select id="set-hint">${opt('yes', s.hint ? 'yes' : 'no', 'Yes')}${opt('no', s.hint ? 'yes' : 'no', 'No (hard)')}</select></div>
    </div>
    <div class="label" style="margin:12px 0 6px">Category</div>
    <select id="set-cat">${opt(0, s.cat, '✨ All categories (random)')}${CATS.map((c, i) => opt(i + 1, s.cat, c)).join('')}</select>
  </div>
  <button class="btn red" data-a="create">Create game code</button>`;
}
function vSeat() {
  const c = App.cfg;
  return `<div class="top"><div><div class="meta">✨ Game</div><div class="code dot">${esc(c.code)}</div></div><button class="btn sm ghost" data-a="home">Back</button></div>
  <div class="card banner"><div class="hint" style="margin:0 0 4px">Tell everyone this code</div><div class="big dot" style="letter-spacing:.15em">${esc(c.code)}</div>
    <p class="hint" style="margin-top:8px">${c.players} players · ${c.imposters} imposter${c.imposters > 1 ? 's' : ''} · ${esc(catName(c.cat))}</p>
    <div class="row mt"><button class="btn sm ghost" data-a="copy">Copy link</button>${navigator.share ? '<button class="btn sm ghost" data-a="share">Share</button>' : ''}</div></div>
  <div class="card"><div class="label">Which player are you?</div>
    <p class="hint" style="margin:0 0 10px">Each person must pick a <b>different</b> number. Tip: go around the circle.</p>
    <div class="seats" style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">
      ${Array.from({ length: c.players }, (_, i) => `<button class="btn ${App.seat === i + 1 ? 'red' : 'ghost'}" data-a="seat" data-n="${i + 1}" style="padding:14px 0">${i + 1}</button>`).join('')}
    </div></div>`;
}
function vCard(d, me) {
  const isImp = d.imps.includes(me);
  if (!App.revealed) return `<div class="stage"><div class="reveal" data-a="flip"><div class="emoji">🃏</div><div class="big dot">TAP ME!</div><div class="hint">Player ${me} · keep it secret</div></div></div>`;
  if (isImp) return `<div class="stage"><div class="reveal imp" data-a="flip"><div class="emoji">😈</div><div class="hint" style="margin:0 0 10px">You are the</div><div class="big dot pk">Imposter</div>
    <div class="hint">${App.cfg.hint ? 'Category · ' + esc(d.category) : 'No hint — blend in'}</div>
    ${d.imps.length > 1 ? `<div class="hint">Partner: Player ${d.imps.filter(s => s !== me).join(', ')}</div>` : ''}
    <div class="hint" style="opacity:.6">tap to hide</div></div></div>`;
  return `<div class="stage"><div class="reveal" data-a="flip"><div class="emoji">🎉</div><div class="hint" style="margin:0 0 10px">Category · ${esc(d.category)}</div><div class="big dot">${esc(d.word)}</div><div class="hint" style="opacity:.6">tap to hide</div></div></div>`;
}
function vPlay() {
  const c = App.cfg, d = deal(c, App.round);
  return `<div class="top"><div><div class="meta">✨ Game ${esc(c.code)} · Player ${App.seat}</div><div class="code dot">Round ${App.round}</div></div>
    <button class="btn sm ghost" data-a="leave">Leave</button></div>
  ${App.answer ? `
  <div class="card banner"><div class="emoji">😈</div><div class="hint" style="margin:0 0 10px">The imposter${d.imps.length > 1 ? 's were' : ' was'}</div>
    <div class="big dot pk">Player ${d.imps.join(' & ')}</div></div>
  <div class="card"><div class="label">The word was <span>${esc(d.category)}</span></div><div class="dot" style="font-size:34px">${esc(d.word)}</div></div>
  <button class="btn red" data-a="next">✨ Next round</button>
  <p class="hint" style="text-align:center;margin-top:8px">Everyone taps Next round together</p>`
  : `${vCard(d, App.seat)}
  <div class="card turn"><div class="hint" style="margin:0 0 6px">${d.nImp > 1 ? d.nImp + ' imposters' : '1 imposter'} this round · starts first</div><div class="starter">Player ${d.starter}</div></div>
  <button class="btn red" data-a="answer">😈 Reveal answer</button>
  <button class="btn ghost mt" data-a="next">⏭ Skip to next round</button>`}
  <div class="row mt2" style="align-items:center">
    <button class="btn sm ghost" data-a="prev" ${App.round <= 1 ? 'disabled' : ''}>◀ Round</button>
    <p class="hint" style="text-align:center;flex:1;margin:0">Out of sync? Make sure everyone shows Round ${App.round}</p>
    <button class="btn sm ghost" data-a="next">Round ▶</button></div>`;
}
function view() {
  if (App.screen === 'setup') return vSetup();
  if (App.screen === 'seat') return vSeat();
  if (App.screen === 'play') return vPlay();
  return vHome();
}
function render() {
  const key = App.screen + '|' + App.round + '|' + App.answer;
  const el = $('#app'); el.classList.toggle('enter', key !== App.viewKey); App.viewKey = key;
  el.innerHTML = view();
  if (App.flipAnim) { const rv = document.querySelector('.reveal'); if (rv) rv.classList.add('flipin'); App.flipAnim = false; }
}

/* ---------- effects ---------- */
function confetti(set) {
  for (let i = 0; i < 40; i++) {
    const e = document.createElement('div'); e.className = 'spark';
    e.textContent = set[Math.floor(Math.random() * set.length)];
    e.style.left = Math.random() * 100 + 'vw'; e.style.fontSize = 16 + Math.floor(Math.random() * 18) + 'px';
    e.style.animationDuration = 2.2 + Math.random() * 2 + 's'; e.style.animationDelay = Math.random() * .8 + 's';
    document.body.appendChild(e); setTimeout(() => e.remove(), 5200);
  }
}
function motes() {
  for (let i = 0; i < 14; i++) {
    const m = document.createElement('div'); m.className = 'mote';
    m.style.left = Math.random() * 100 + 'vw'; m.style.animationDuration = 12 + Math.random() * 14 + 's';
    m.style.animationDelay = -Math.random() * 20 + 's';
    const z = 10 + Math.floor(Math.random() * 14); m.style.width = m.style.height = z + 'px';
    document.body.appendChild(m);
  }
}

/* ---------- actions ---------- */
function goRound(r) { App.round = Math.max(1, r); App.revealed = false; App.answer = false; save(); render(); window.scrollTo(0, 0); }
const actions = {
  home: () => { App.screen = 'home'; App.status = ''; history.replaceState(null, '', location.pathname); render(); },
  newgame: () => { App.screen = 'setup'; render(); },
  create: () => {
    const s = App.setup;
    const imp = Math.min(s.imposters, Math.max(1, Math.floor((s.players - 1) / 2)));
    const seed = Math.floor(Math.random() * 65536);
    App.cfg = decode(encode({ seed, players: s.players, imposters: imp, hint: s.hint, cat: s.cat }));
    App.seat = 0; App.round = 1; App.screen = 'seat';
    history.replaceState(null, '', '?g=' + App.cfg.code); render();
  },
  join: () => {
    const cfg = decode($('#code').value);
    if (!cfg) { App.status = 'That code doesn’t look right — it should be 6 letters/numbers.'; render(); return; }
    App.cfg = cfg; App.seat = 0; App.round = 1; App.status = ''; App.screen = 'seat';
    history.replaceState(null, '', '?g=' + cfg.code); render();
  },
  resume: () => { const cfg = decode(saved.code); if (!cfg) return; App.cfg = cfg; App.seat = saved.seat; App.round = saved.round || 1; App.screen = 'play'; render(); },
  seat: el => { App.seat = +el.dataset.n; App.round = 1; App.revealed = false; App.answer = false; App.screen = 'play'; save(); render(); },
  flip: () => { App.revealed = !App.revealed; App.flipAnim = true; render(); },
  answer: () => { if (confirm('Reveal the word and imposter? (Only do this after voting)')) { App.answer = true; confetti(['😈', '🎉', '⭐', '🥳', '💥', '🍭']); render(); } },
  next: () => goRound(App.round + 1),
  prev: () => goRound(App.round - 1),
  leave: () => { if (confirm('Leave this game?')) actions.home(); },
  copy: () => { const l = gameLink(App.cfg.code); (navigator.clipboard ? navigator.clipboard.writeText(l) : Promise.reject()).then(() => toast('✨ Link copied')).catch(() => prompt('Copy this link:', l)); },
  share: () => navigator.share({ title: 'Imposter', text: 'Join my Imposter game! Code: ' + App.cfg.code, url: gameLink(App.cfg.code) }).catch(() => {})
};
document.addEventListener('click', e => { const el = e.target.closest('[data-a]'); if (el && !el.disabled && actions[el.dataset.a]) actions[el.dataset.a](el); });
document.addEventListener('input', e => { if (e.target.id === 'code') e.target.value = e.target.value.toUpperCase(); });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'code') actions.join(); });
document.addEventListener('change', e => {
  const s = App.setup, v = e.target.value;
  if (e.target.id === 'set-players') { s.players = Math.max(MIN_P, Math.min(MAX_P, +v || 5)); s.imposters = Math.min(s.imposters, Math.max(1, Math.floor((s.players - 1) / 2))); render(); }
  if (e.target.id === 'set-imposters') { s.imposters = Math.max(1, Math.min(3, +v || 1)); render(); }
  if (e.target.id === 'set-hint') s.hint = v === 'yes';
  if (e.target.id === 'set-cat') s.cat = Math.max(0, Math.min(CATS.length, +v || 0));
});
motes();
if (new URLSearchParams(location.search).get('g')) { const cfg = decode(new URLSearchParams(location.search).get('g')); if (cfg) { App.cfg = cfg; App.screen = 'seat'; } }
render();
</script>
</body>
</html>
